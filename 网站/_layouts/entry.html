<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="{{ page.summary | escape }}"><title>{{ page.title | escape }} — The Jiaxun Journal</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Libre+Caslon+Display&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"><style>:root{--paper:#eee4d3;--ink:#241d18;--rust:#984c3c;--rule:#a99a86}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.8 'DM Sans',sans-serif}a{color:inherit}a:hover{color:var(--rust)}.wrap{max-width:920px;margin:0 auto;padding:25px clamp(22px,5vw,65px) 110px}.small{font:11px/1.7 'Space Mono',monospace;text-transform:uppercase}.mast{border-bottom:2px solid var(--ink);display:flex;justify-content:space-between;gap:15px;padding-bottom:15px}.mast a{text-decoration:none}.eyebrow{margin-top:95px;color:var(--rust)}h1{font:clamp(55px,9vw,112px)/.95 'Libre Caslon Display',Georgia,serif;letter-spacing:-.035em;margin:20px 0 32px}header p{font:clamp(19px,2.5vw,25px)/1.5 'DM Sans',sans-serif;max-width:740px}header{padding-bottom:35px;border-bottom:1px solid var(--rule)}.content{max-width:720px;padding-top:34px}.content h2{font:45px/1.1 'Libre Caslon Display',Georgia,serif;margin:60px 0 16px}.content h3{font:32px/1.15 'Libre Caslon Display',Georgia,serif;margin-top:35px}.content p,.content li{line-height:1.9}.content blockquote{border-left:2px solid var(--rust);padding-left:22px;font:29px/1.3 'Libre Caslon Display',serif;margin:40px 0}.content img{max-width:100%;height:auto}.content a{text-decoration:underline;text-underline-offset:3px}footer{border-top:1px solid var(--rule);margin-top:80px;padding-top:20px;display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}@media(max-width:560px){h1{font-size:58px}.eyebrow{margin-top:65px}}</style></head><body><div class="wrap"><div class="mast small"><a href="{{ '/' | relative_url }}">THE JIAXUN JOURNAL</a><a href="{{ '/#archive' | relative_url }}">← BACK TO ARCHIVE</a></div><header><p class="small eyebrow">{{ page.category | escape }} / {{ page.date | date: '%Y' }}</p><h1>{{ page.title | escape }}</h1><p>{{ page.summary | escape }}</p></header><main class="content">{{ content }}</main><footer class="small"><span>© {{ 'now' | date: '%Y' }} Jiaxun Zhang</span><a href="{{ '/#archive' | relative_url }}">Browse the archive ↗</a></footer></div></body></html>
