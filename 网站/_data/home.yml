intro: "A collection of writing, research, community projects and the occasionally complicated thoughts behind them."
tagline: "Not quite a résumé. Not quite a diary. Somewhere in between."
about_heading: "Hi, I'm Jiaxun."
about_first: "My work doesn't stay neatly in one category. I studied gender and social justice, spent years writing fiction, and have worked on programmes and spaces where people come together to learn, talk and make things happen."
about_second: "I like listening closely, asking awkward questions and getting the practical details right. This site is an ongoing collection of those interests — not a comprehensive record of everything I've done."
contact_text: "Questions about a project, a piece of writing, or something worth working on together? My inbox is open."
